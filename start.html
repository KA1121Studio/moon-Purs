<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CloudMoon Purs - Start</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/KA1121Studio/netlify-badge@main/block-netlify-badge.js"></script>  
<style>
  :root{
    --bg:#04070f;
    --panel:#12141c;
    --violet:#8b5cf6;
    --fuchsia:#d946ef;
    --violet-soft:#a78bfa;
    --text:#eaf0ff;
    --muted:#9ca3af;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);overflow:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);user-select:none;-webkit-touch-callout:none;
  }

  /* ===== 背景 ===== */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 38%, rgba(139,92,246,.22), transparent 65%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(217,70,239,.12), transparent 70%),
      linear-gradient(160deg,#0b1026 0%,#070b18 55%,#04070f 100%);
    animation:bgBreathe 9s ease-in-out infinite;
  }
  @keyframes bgBreathe{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.15);}
  }

  /* ===== 奥から手前に流れる星 ===== */
  .stars{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .star{
    position:absolute;background:#fff;border-radius:50%;
    will-change:transform,opacity;
  }
  @keyframes drift{
    0%{transform:translate3d(0,0,0) scale(.4);opacity:0;}
    15%{opacity:.9;}
    100%{transform:translate3d(var(--dx),var(--dy),0) scale(1.4);opacity:0;}
  }

  /* スキャンライン */
  .scanlines{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(0deg,
      rgba(139,92,246,.045) 0 1px, transparent 1px 4px);
    mix-blend-mode:screen;opacity:.7;
    animation:scanMove 8s linear infinite;
  }
  @keyframes scanMove{from{background-position:0 0}to{background-position:0 8px}}

  /* ===== HUDコーナー ===== */
  .corner{
    position:fixed;width:26px;height:26px;z-index:10;pointer-events:none;
    border-color:rgba(139,92,246,.55);border-style:solid;
    opacity:0;animation:cornerIn .6s ease-out forwards;
  }
  .corner.tl{top:20px;left:20px;border-width:1px 0 0 1px;border-radius:6px 0 0 0;animation-delay:.1s;}
  .corner.tr{top:20px;right:20px;border-width:1px 1px 0 0;border-radius:0 6px 0 0;animation-delay:.2s;}
  .corner.bl{bottom:20px;left:20px;border-width:0 0 1px 1px;border-radius:0 0 0 6px;animation-delay:.3s;}
  .corner.br{bottom:20px;right:20px;border-width:0 1px 1px 0;border-radius:0 0 6px 0;animation-delay:.4s;}
  @keyframes cornerIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

  /* 上部ステータス */
  .hud-top{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);
    z-index:10;display:flex;align-items:center;gap:10px;
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--violet-soft);pointer-events:none;white-space:nowrap;
    opacity:0;animation:fadeIn .8s .3s forwards;
  }
  .hud-top .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--violet);box-shadow:0 0 8px var(--violet);
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

  /* ===== 中央 ===== */
  .stage{
    position:fixed;inset:0;z-index:6;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:0 20px;
    animation:stageFloat 6s ease-in-out infinite;
  }
  @keyframes stageFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }

  /* ロゴマーク */
  .mark{
    position:relative;width:128px;height:128px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:34px;
    opacity:0;transform:scale(.7);
    animation:markIn 1s cubic-bezier(.2,.9,.3,1.4) .15s forwards;
  }
  @keyframes markIn{to{opacity:1;transform:scale(1)}}

  .mark::after{
    content:'';position:absolute;inset:-30px;border-radius:50%;
    background:radial-gradient(circle, rgba(139,92,246,.35) 0%, transparent 65%);
    animation:markGlow 2.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes markGlow{
    0%,100%{transform:scale(.9);opacity:.5;}
    50%{transform:scale(1.15);opacity:.9;}
  }

  .mark .ring{
    position:absolute;inset:0;border-radius:50%;
    border:3px solid transparent;
    border-top-color:var(--violet);
    border-right-color:var(--fuchsia);
    animation:spin 1.2s linear infinite;
  }
  .mark .ring.mid{
    inset:-12px;border-width:2px;
    border-top-color:rgba(167,139,250,.7);
    border-right-color:transparent;
    border-bottom-color:rgba(217,70,239,.6);
    border-left-color:transparent;
    animation:spin 3.5s linear infinite reverse;
  }
  .mark .ring.outer{
    inset:-26px;border-width:1px;
    border-top-color:rgba(167,139,250,.45);
    border-right-color:transparent;
    border-bottom-color:rgba(217,70,239,.35);
    border-left-color:transparent;
    animation:spin 9s linear infinite;
  }
  .mark .moon{
    font-size:52px;line-height:1;color:#fff;
    text-shadow:0 0 26px rgba(139,92,246,.95), 0 0 60px rgba(217,70,239,.55);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

  /* タイトル */
  .title{
    font-size:clamp(2rem,7vw,3.4rem);
    font-weight:900;letter-spacing:.02em;
    display:flex;gap:.06em;align-items:baseline;
    flex-wrap:nowrap;
  }
  .title .ch{
    display:inline-block;
    opacity:0;transform:translateY(28px) rotateX(50deg);
    transform-origin:bottom;
    animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  @keyframes chIn{to{opacity:1;transform:translateY(0) rotateX(0)}}

  .title .cloud .ch{color:#fff;}
  .title .moon-word .ch{
    background:linear-gradient(135deg,var(--violet-soft),var(--fuchsia));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(139,92,246,.6));
  }

  /* PLUSバッジ */
  .plus{
    position:relative;overflow:hidden;
    font-size:.45em;font-weight:800;letter-spacing:.1em;
    color:var(--violet-soft);
    padding:.25em .5em;border-radius:8px;
    border:1px solid rgba(139,92,246,.4);
    background:rgba(139,92,246,.08);
    transform:translateY(-.35em);
    opacity:0;
    animation:plusIn .7s cubic-bezier(.2,.9,.3,1.4) 1.3s forwards;
  }
  @keyframes plusIn{to{opacity:1;}}
  .plus::after{
    content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);
    animation:shimmer 3.2s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{left:-60%;}
    45%,100%{left:130%;}
  }

  .tagline{
    margin-top:16px;font-size:clamp(.65rem,2.2vw,.82rem);
    letter-spacing:.5em;text-transform:uppercase;
    color:var(--muted);
    opacity:0;animation:fadeIn .9s 1.5s forwards;
  }
  @keyframes fadeIn{to{opacity:1}}

  /* ===== ローディング ===== */
  .load-wrap{
    margin-top:46px;width:min(280px,60vw);
    opacity:0;animation:fadeIn .6s 1.7s forwards;
    text-align:center;
  }
  .load-bar{
    position:relative;
    width:100%;height:6px;border-radius:3px;
    background:rgba(139,92,246,.15);
    overflow:hidden;
  }
  .load-fill{
    height:100%;width:0%;
    border-radius:3px;
    background:linear-gradient(90deg,var(--violet),var(--fuchsia));
    box-shadow:0 0 14px rgba(139,92,246,.7);
    transition:width .35s ease;
    position:relative;
  }
  .load-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.7),transparent);
    transform:skewX(-20deg);
    animation:barShine 1.6s linear infinite;
  }
  @keyframes barShine{
    0%{transform:translateX(-120%) skewX(-20deg);}
    100%{transform:translateX(220%) skewX(-20deg);}
  }

  .load-meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;font-size:11px;letter-spacing:.22em;
    color:var(--violet-soft);text-transform:uppercase;
  }
  .load-step{color:var(--muted);font-size:11px;letter-spacing:.1em;}

  /* 下部フッター */
  .hud-bottom{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    z-index:10;font-size:10px;letter-spacing:.38em;text-transform:uppercase;
    color:rgba(156,163,175,.75);pointer-events:none;white-space:nowrap;
    opacity:0;animation:hudBottomIn 1.2s 2s forwards;
  }
  @keyframes hudBottomIn{
    0%{opacity:0;transform:translate(-50%,10px);filter:blur(4px);}
    100%{opacity:1;transform:translate(-50%,0);filter:blur(0);}
  }

  /* 起動フラッシュ */
  .flash{
    position:fixed;inset:0;z-index:30;pointer-events:none;
    background:radial-gradient(circle at 50% 42%,
      rgba(167,139,250,.85) 0%,
      rgba(139,92,246,.35) 30%,
      transparent 62%);
    opacity:0;
    animation:flashIn 1s ease-out .05s forwards;
  }
  @keyframes flashIn{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

  /* 完了時フラッシュ */
  .complete-flash{
    position:fixed;inset:0;z-index:29;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,
      rgba(217,70,239,.6) 0%,
      rgba(139,92,246,.25) 35%,
      transparent 65%);
    opacity:0;
  }
  .complete-flash.on{animation:completeFlash .8s ease-out forwards;}
  @keyframes completeFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <div class="scanlines"></div>
  <div class="flash"></div>
  <div class="complete-flash" id="completeFlash"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="hud-top"><span class="dot"></span>CloudMoon · Initializing</div>

  <main class="stage">
    <div class="mark">
      <div class="ring outer"></div>
      <div class="ring mid"></div>
      <div class="ring"></div>
      <div class="moon">☾</div>
    </div>

    <h1 class="title" id="title"></h1>
    <p class="tagline">Your Game · Your Cloud</p>

    <div class="load-wrap">
      <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
      <div class="load-meta">
        <span class="load-step" id="loadStep">セッションを初期化中...</span>
        <span id="loadPct">0%</span>
      </div>
    </div>
  </main>

  <div class="hud-bottom">Low Latency · 4K Stream Ready</div>

<script>
  /* ===== 奥から手前に流れる星 ===== */
  (function(){
    const box = document.getElementById('stars');

    function spawn(){
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random()*1.8+0.6;

      const angle = Math.random()*Math.PI*2;
      const dist = 40 + Math.random()*120;
      const startX = 50 + Math.cos(angle)*8;
      const startY = 45 + Math.sin(angle)*8;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;

      const duration = 2.4 + Math.random()*2.6;
      const delay = Math.random()*1.2;

      s.style.cssText = `
        width:${size}px;height:${size}px;
        left:${startX}%;top:${startY}%;
        --dx:${dx}vw;--dy:${dy}vh;
        animation:drift ${duration}s linear ${delay}s forwards;
        opacity:0;
      `;
      box.appendChild(s);

      setTimeout(()=>s.remove(), (duration+delay)*1000 + 200);
    }

    setInterval(spawn, 90);
    for(let i=0;i<25;i++) setTimeout(spawn, i*60);
  })();

  /* ===== タイトルを1文字ずつ生成 ===== */
  (function(){
    const title = document.getElementById('title');
    const groups = [
      { cls:'cloud', text:'Cloud' },
      { cls:'moon-word', text:'Moon' }
    ];
    let idx = 0;
    groups.forEach(g=>{
      const span = document.createElement('span');
      span.className = g.cls;
      [...g.text].forEach(ch=>{
        const c = document.createElement('span');
        c.className = 'ch';
        c.textContent = ch;
        c.style.animationDelay = (0.4 + idx*0.06) + 's';
        span.appendChild(c);
        idx++;
      });
      title.appendChild(span);
    });

    const plus = document.createElement('span');
    plus.className = 'plus';
    plus.textContent = 'PLUS';
    title.appendChild(plus);
  })();

  /* ===== ローディング → main.html へ遷移 ===== */
  (function(){
    const fill = document.getElementById('loadFill');
    const pctEl = document.getElementById('loadPct');
    const stepEl = document.getElementById('loadStep');
    const completeFlash = document.getElementById('completeFlash');

    const steps = [
      { until: 20, label: 'セッションを初期化中...' },
      { until: 45, label: 'サーバーに接続中...' },
      { until: 70, label: 'ゲームを準備中...' },
      { until: 90, label: 'ストリームを開始中...' },
      { until: 100, label: 'まもなく開始します' }
    ];

    let pct = 0;
    let redirected = false;

const goMain = () => {
  if (redirected) return;
  redirected = true;

  // iframe 内で動いている場合は親に完了通知
  if (window.parent && window.parent !== window) {
    window.parent.postMessage('cloudmoon-start-done', '*');
  } else {
    // 単体で開かれた場合は従来通り main.html へ
    const search = window.location.search || '';
    window.location.href = './main.html' + search;
  }
};

    const tick = () => {
      const speed = pct < 70 ? 5 + Math.random()*5 : 2 + Math.random()*3;
      pct = Math.min(100, pct + speed);
      fill.style.width = pct + '%';
      pctEl.textContent = Math.floor(pct) + '%';

      const step = steps.find(s => pct <= s.until) || steps[steps.length-1];
      if (stepEl.textContent !== step.label) stepEl.textContent = step.label;

      if (pct < 100) {
        setTimeout(tick, 50 + Math.random()*60);
      } else {
        // 完了演出 → 1秒後に本体へ
        completeFlash.classList.add('on');
        stepEl.textContent = 'Ready';
        setTimeout(goMain, 1000);
      }
    };
    tick();

    // フォールバック：万一タイマーが止まっても 7 秒後に必ず遷移
    setTimeout(goMain, 7000);
  })();
</script>
</body>
</html>
